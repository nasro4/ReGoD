ty">لا توجد جلسات مسجلة</div>'}</div></div>${energyAnalytics()}<div class="card section"><h3>حدود الإحصائيات</h3><p class="muted">بيانات النسخة القديمة تسجل اكتمال النشاط لا عدد الدقائق المنفذة. الإحصاءات لا تساوي جودة التعلم أو الإنتاجية، ولا تعتبر الأيام غير المسجلة فشلًا.</p></div>`}function focus(){return `<div class="cols"><div class="card"><h3>جلسة تركيز</h3><label>موضوع الجلسة</label><input id="focusSubject" placeholder="مثال: Quantum Mechanics" value="${esc(timer.subject)}" oninput="timer.subject=this.value"><div class="timer" id="timerDisplay">${formatTime(timer.remaining)}</div><div class="row" style="justify-content:center">${[25,50,90].map(n=>`<button onclick="setTimer(${n})">${n} دقيقة</button>`).join('')}</div><div class="row section" style="justify-content:center"><button class="primary" onclick="toggleTimer()" id="timerButton">${timer.active?'إيقاف مؤقت':'بدء'}</button><button onclick="finishTimer()">إنهاء وتسجيل</button><button onclick="resetTimer()">إعادة ضبط</button></div><p class="sub">المؤقت يحسب الزمن الفعلي المنقضي، ويمكن إنهاء الجلسة مبكرًا. إبقاء الصفحة مفتوحة يساعد على عرض الوقت.</p></div><div class="card"><h3>آخر الجلسات</h3>${S.sessions.slice(-12).reverse().map(x=>`<div class="item">${esc(x.subject)} <b>${x.minutes} دقيقة</b><div class="sub">${x.date}</div></div>`).join('')||'<div class="empty">ابدأ أول جلسة</div>'}</div></div>`}function formatTime(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function setTimer(n){timer.active=false;timer.remaining=n*60;timer.total=n*60;timer.end=0;render()}function toggleTimer(){if(timer.active){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timer.active=false}else{timer.active=true;timer.end=Date.now()+timer.remaining*1000}render()}function resetTimer(){timer.active=false;timer.remaining=50*60;timer.total=50*60;render()}function finishTimer(){if(timer.active)timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timer.active=false;let elapsed=timer.total-timer.remaining;if(elapsed<=0){let entered=prompt('كم دقيقة ركزت فعليًا؟','25');if(entered===null)return;elapsed=Math.max(0,Math.round(Number(entered)*60))}if(elapsed>0){S.sessions.push({id:uid(),date:new Date().toISOString(),subject:timer.subject||'جلسة تركيز',minutes:Math.round(elapsed/60)});save()}timer.remaining=50*60;timer.total=50*60;render()}function exportData(){let blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),state:S},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trackern-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let obj=JSON.parse(rd.result),data=obj.state||obj;if(!Array.isArray(data.schedule))throw Error('لا يوجد جدول صالح');if(!confirm('استيراد الملف سيستبدل بيانات الموقع الحالية. هل تريد المتابعة؟'))return;if(data.version>=2||Array.isArray(data.subjects)){S={...initial(),...data};ensureV5()}else{S={...initial(),schedule:data.schedule,records:Object.fromEntries(Object.entries(data).filter(([k])=>/^\d{4}-\d\d-\d\d$/.test(k))),money:data.money||[],openingBalance:data.meta?.openingBalance||0,media:data.media||{}}}ensureV5();save();render();alert('تم الاستيراد بنجاح')}catch(e){alert('ملف غير صالح: '+e.message)}};rd.readAsText(file)}function settings(){return `<div class="cols"><div class="card stack"><h3>النسخ الاحتياطي</h3><p class="muted">البيانات مخزنة في هذا المتصفح على هذا الجهاز. صدّرها دوريًا حتى لا تضيع عند حذف بيانات المتصفح.</p><button class="primary" onclick="exportData()">↓ تصدير JSON</button><label>استيراد نسخة قديمة أو جديدة</label><input type="file" accept=".json,application/json" onchange="importData(this.files[0]);this.value=''"/><div class="notice">يدعم استيراد نسختك الأصلية ذات الإصدار 1. الاستيراد يستبدل الحالة الحالية بعد التأكيد.</div><button type="button" onclick="cloudForm()">☁ مزامنة WebDAV اختيارية</button></div><div class="card stack"><h3>الإعدادات</h3><label>الرصيد الافتتاحي (دج)</label><input id="opening" type="number" value="${S.openingBalance}"><button onclick="S.openingBalance=Number(document.getElementById('opening').value);save();render()">حفظ الرصيد</button><hr><button class="danger" onclick="if(confirm('سيتم حذف بيانات النسخة الحالية من هذا المتصفح نهائيًا. هل أنت متأكد؟')){S=initial();save();render()}">إعادة ضبط إلى النسخة المرفقة الأصلية</button></div></div>`}const titles=Object.fromEntries(navs.map(([id,,title])=>[id,title]));function render(){document.getElementById('pageTitle').textContent=titles[page];let navhtml=navs.map(([id,icon,title])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${title}</button>`).join('');document.getElementById('nav').innerHTML=navhtml;const mobileIcons={dashboard:`<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></svg>`,today:`<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>`,week:`<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h2M14 14h2M8 18h2"/></svg>`,novel:`<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14M3 18V5a2 2 0 0 1 2-2h3a5 5 0 0 1 4 2 5 5 0 0 1 4-2h3a2 2 0 0 1 2 2v13h-5a5 5 0 0 0-4 2 5 5 0 0 0-4-2z"/></svg>`,more:`<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`};const primary=['dashboard','today','week','novel'];document.getElementById('mobile').innerHTML=navs.filter(([id])=>primary.includes(id)).map(([id,icon,title])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="nav-icon">${mobileIcons[id]}</span><span class="nav-label">${({dashboard:'الرئيسية',today:'اليوم',week:'الأسبوع',novel:'الرواية'})[id]}</span></button>`).join('')+`<button class="${primary.includes(page)?'':'active'}" onclick="openMore()" aria-label="المزيد من الأقسام"><span class="nav-icon">${mobileIcons.more}</span><span class="nav-label">المزيد</span></button>`;document.getElementById('moreItems').innerHTML=navs.filter(([id])=>!primary.includes(id)).map(([id,icon,title])=>`<button onclick="go('${id}')"><span>${icon}</span><span>${title}</span></button>`).join('');document.getElementById('content').innerHTML=({dashboard,today:todayView,week:weekView,study,focus,novel,media:mediaView,quests,lore,insights,finance,stats,settings})[page]();if(page==='focus'){let v=document.createElement('input');v.type='hidden';v.id='focusDuration';v.value=timer.remaining/60;document.getElementById('content').appendChild(v)}}
// V5 modules: separate data domains, normalized identifiers and date-scoped completion.
function ensureV5(){S.quests ||= [];S.questLog ||= {};S.loreLinks ||= [];S.sync ||= {};S.novel ||= [];for(const x of S.novel)if(!x.id)x.id=uid()}
ensureV5();
const validDate=(d)=>/^\d{4}-\d{2}-\d{2}$/.test(d);
function weekdayISO(d){return new Date(d+'T12:00:00').getDay()}
function questDue(q,d){if(q.repeat==='daily')return true;if(q.repeat==='weekly')return weekdayISO(d)===Number(q.weekday);return q.date===d}
function quests(){ensureV5();const d=selectedDate||today(),due=S.quests.filter(q=>questDue(q,d)),done=S.questLog[d]||{};return `<div class="row between"><p class="sub">مهام الألعاب منفصلة تمامًا عن إنجاز الدراسة؛ تتكرر حسب التاريخ، ولا تُحذف السجلات القديمة.</p><button class="primary" onclick="questForm()">+ مهمة لعبة</button></div><div class="card"><div class="row between"><h3>مهام ${esc(d)}</h3><input aria-label="تاريخ مهام الألعاب" type="date" style="max-width:180px" value="${esc(d)}" onchange="selectedDate=this.value;render()"></div>${due.map(q=>`<div class="item row between"><div><b>${esc(q.title)}</b><div class="sub">${esc(q.game||'لعبة')} • ${q.repeat==='daily'?'يومي':q.repeat==='weekly'?'أسبوعي':'مرة واحدة'}</div></div><div class="row"><button class="${done[q.id]?'primary':''}" onclick="toggleQuest('${q.id}')">${done[q.id]?'✓ منجز':'إنجاز'}</button><button onclick="questForm('${q.id}')" aria-label="تعديل">✎</button><button class="danger" onclick="deleteQuest('${q.id}')" aria-label="حذف">×</button></div></div>`).join('')||'<div class="empty">لا توجد مهام ألعاب لهذا التاريخ</div>'}</div><div class="card section"><h3>كل المهام المسجلة</h3>${S.quests.map(q=>`<div class="item row between"><span>${esc(q.game||'لعبة')} — ${esc(q.title)}</span><button onclick="questForm('${q.id}')">تعديل</button></div>`).join('')||'<p class="muted">أضف أول مهمة</p>'}</div>`}
function toggleQuest(id){const d=selectedDate||today();S.questLog[d]||={};S.questLog[d][id]=!S.questLog[d][id];save();render()}
function deleteQuest(id){if(!confirm('حذف هذه المهمة المتكررة؟ سيبقى سجلها التاريخي.'))return;S.quests=S.quests.filter(q=>q.id!==id);save();render()}
function questForm(id){const q=S.quests.find(x=>x.id===id)||{title:'',game:'',repeat:'daily',weekday:6,date:today()};modal(`<h2>${id?'تعديل':'إضافة'} مهمة لعبة</h2><form id="questForm" class="stack"><label>اسم المهمة</label><input name="title" required maxlength="120" value="${esc(q.title)}"><label>اللعبة</label><input name="game" maxlength="120" value="${esc(q.game)}"><label>التكرار</label><select name="repeat"><option value="daily" ${q.repeat==='daily'?'selected':''}>يومي</option><option value="weekly" ${q.repeat==='weekly'?'selected':''}>أسبوعي</option><option value="once" ${q.repeat==='once'?'selected':''}>مرة واحدة</option></select><label>يوم الأسبوع (للتكرار الأسبوعي)</label><select name="weekday">${['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((x,i)=>`<option value="${i}" ${Number(q.weekday)===i?'selected':''}>${x}</option>`).join('')}</select><label>تاريخ المهمة الفردية</label><input type="date" name="date" value="${esc(q.date||today())}"><button class="primary">حفظ</button></form>`);document.getElementById('questForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(id)Object.assign(q,data);else S.quests.push({...data,id:uid()});save();closeModal();render()}}
function lore(){ensureV5();const nodes=S.novel,links=S.loreLinks.filter(l=>nodes.some(n=>n.id===l.from)&&nodes.some(n=>n.id===l.to));const w=760,h=440,cx=w/2,cy=h/2,r=Math.min(285,Math.max(95,nodes.length*18));const positions=Object.fromEntries(nodes.map((n,i)=>[n.id,{x:cx+r*Math.cos(2*Math.PI*i/nodes.length-Math.PI/2),y:cy+Math.min(170,r*.7)*Math.sin(2*Math.PI*i/nodes.length-Math.PI/2)}]));return `<div class="row between"><p class="sub">شبكة مترابطة بين العناصر الروائية الموجودة. اضغط على عقدة لعرض تفاصيلها وروابطها.</p><div class="row"><button onclick="novelAddMenu()">+ عنصر روائي</button><button class="primary" onclick="loreLinkForm()">+ علاقة</button></div></div><div class="card"><h3>خريطة العالم الروائي</h3>${nodes.length?`<div class="graph-scroll"><svg role="img" aria-label="شبكة العلاقات الروائية" viewBox="0 0 ${w} ${h}" width="100%" style="min-width:580px;max-height:500px">${links.map(l=>`<line x1="${positions[l.from].x}" y1="${positions[l.from].y}" x2="${positions[l.to].x}" y2="${positions[l.to].y}" stroke="#8b69ca" stroke-width="2" opacity=".8"/>`).join('')}${nodes.map(n=>`<g role="button" tabindex="0" onclick="loreNode('${n.id}')" onkeydown="if(event.key==='Enter')loreNode('${n.id}')" style="cursor:pointer"><circle cx="${positions[n.id].x}" cy="${positions[n.id].y}" r="32" fill="#40275f" stroke="#b694ff" stroke-width="2"/><text x="${positions[n.id].x}" y="${positions[n.id].y+49}" text-anchor="middle" font-size="13" fill="#f6eaff">${esc(n.title).slice(0,25)}</text><text x="${positions[n.id].x}" y="${positions[n.id].y+4}" text-anchor="middle" font-size="16" fill="white">${esc((n.type||'✦').slice(0,2))}</text></g>`).join('')}</svg></div>`:'<div class="empty">أنشئ عناصر في قسم الرواية أولًا لتظهر هنا</div>'}</div><div class="card section"><h3>العلاقات المحفوظة</h3>${links.map(l=>`<div class="item row between"><span>${esc(nodes.find(n=>n.id===l.from)?.title)} ← ${esc(l.label)} → ${esc(nodes.find(n=>n.id===l.to)?.title)}</span><button class="danger" onclick="removeLoreLink('${l.id}')">حذف</button></div>`).join('')||'<div class="empty">لم تضف روابط بعد</div>'}</div>`}
function loreNode(id){const n=S.novel.find(x=>x.id===id);if(!n)return;const links=S.loreLinks.filter(x=>x.from===id||x.to===id);modal(`<h2>${esc(n.title)}</h2><p class="sub">${esc(n.type||'عنصر روائي')}</p><p style="white-space:pre-wrap">${esc(n.body||'لا تفاصيل')}</p><h3>العلاقات</h3>${links.map(l=>`<div class="item">${esc(l.label)} — ${esc(S.novel.find(x=>x.id===(l.from===id?l.to:l.from))?.title||'عنصر محذوف')}</div>`).join('')||'<p class="muted">لا توجد علاقات</p>'}<button onclick="closeModal();go('novel')">الذهاب إلى الرواية</button>`)}
function loreLinkForm(){if(S.novel.length<2){alert('أضف عنصرين روائيين على الأقل.');return}const opts=S.novel.map(n=>`<option value="${n.id}">${esc(n.title)}</option>`).join('');modal(`<h2>إنشاء علاقة</h2><form id="linkForm" class="stack"><label>العنصر الأول</label><select name="from">${opts}</select><label>نوع العلاقة</label><input name="label" maxlength="100" required placeholder="حليف / عدو / شهد الحدث / ينتمي إلى"><label>العنصر الثاني</label><select name="to">${opts}</select><button class="primary">إضافة العلاقة</button></form>`);document.getElementById('linkForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));if(x.from===x.to){alert('اختر عنصرين مختلفين');return}S.loreLinks.push({...x,id:uid()});save();closeModal();render()}}
function removeLoreLink(id){if(!confirm('حذف العلاقة؟'))return;S.loreLinks=S.loreLinks.filter(x=>x.id!==id);save();render()}
function insights(){ensureV5();const days=Object.entries(S.records).filter(([d])=>validDate(d)&&d<=today()).sort(([a],[b])=>a.localeCompare(b));const grouped=new Map(),energy=[];let completed=0,partial=0,skipped=0;for(const [d,r] of days){const statuses={...(r.done||{})};for(const [id,v] of Object.entries(r.statuses||{}))statuses[id]=v;for(const v of Object.values(statuses)){if(v===true||v==='enough'||v==='mastered')completed++;else if(v==='partial')partial++;else if(v==='skipped')skipped++}for(const [id,e] of Object.entries(r.taskEnergy||{})){if(!(Number(e.before)>=1&&Number(e.before)<=5&&Number(e.after)>=1&&Number(e.after)<=5))continue;const item=S.schedule.find(x=>x.id===id);const label=item?.label||id;const g=grouped.get(label)||{n:0,sum:0};g.n++;g.sum+=Number(e.after)-Number(e.before);grouped.set(label,g);energy.push({d,delta:Number(e.after)-Number(e.before)})}}const month=today().slice(0,7);const monthDone=days.filter(([d])=>d.startsWith(month)).reduce((sum,[,r])=>sum+Object.values({...r.done,...r.statuses}).filter(x=>x===true||x==='enough'||x==='mastered').length,0);const results=[...grouped].filter(([,g])=>g.n>=3).sort((a,b)=>a[1].sum/a[1].n-b[1].sum/b[1].n);const weeks=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const r=S.records[key]||{};return {key,n:Object.values({...r.done,...r.statuses}).filter(x=>x===true||x==='enough'||x==='mastered').length}});return `<div class="grid"><div class="card"><div class="muted">مكتمل في السجلات</div><div class="metric">${completed}</div></div><div class="card"><div class="muted">جزئي / متجاوز</div><div class="metric">${partial} / ${skipped}</div></div><div class="card"><div class="muted">هذا الشهر</div><div class="metric">${monthDone}</div></div><div class="card"><div class="muted">قياسات طاقة مزدوجة</div><div class="metric">${energy.length}</div></div></div><div class="cols section"><div class="card"><h3>آخر 7 أيام</h3><div class="chart">${weeks.map(x=>`<div class="chartcol"><div class="column" style="height:${Math.max(2,x.n/Math.max(1,...weeks.map(y=>y.n))*100)}%"></div><small>${x.key.slice(5)}<br>${x.n}</small></div>`).join('')}</div></div><div class="card"><h3>قراءة تلقائية للبيانات</h3>${energy.length<3?'<p class="muted">لا توجد قياسات طاقة مزدوجة كافية لإظهار اتجاه أولي. سجّل الطاقة قبل وبعد ثلاث مهام على الأقل.</p>':`<p>متوسط تغير الطاقة المسجل: <b>${(energy.reduce((s,x)=>s+x.delta,0)/energy.length).toFixed(2)}</b> نقطة من مقياس 1–5، بناءً على ${energy.length} قياسًا مزدوجًا.</p>`}${results.length?`<h4>الأنشطة ذات ثلاث قياسات على الأقل</h4>${results.map(([name,g])=>`<div class="item">${esc(name)}: ${(g.sum/g.n).toFixed(2)} نقطة (${g.n} قياسات)</div>`).join('')}`:'<p class="muted">مقارنة الأنشطة تتطلب ثلاث قياسات مزدوجة على الأقل لكل نشاط.</p>'}</div></div><div class="card section"><h3>كيف تُقرأ هذه النتائج؟</h3><p class="muted">هذه إحصاءات وصفية فقط، لا تستنتج السببية ولا جودة التعلم. عدم تسجيل المهمة ليس إخفاقًا. سجلات الإنجاز القديمة لا تثبت عدد الدقائق الفعلية. يتم تحديث النتائج من بياناتك المحلية مباشرة.</p></div>`}
// Optional BYO WebDAV sync. Uses authenticated remote storage and manual conflict resolution.
function cloudForm(){ensureV5();modal(`<h2>مزامنة WebDAV اختيارية</h2><p class="muted">تتطلب خادم WebDAV خاصًا بك يدعم HTTPS وCORS. البيانات تُرسل إلى الخادم الذي تختاره؛ لا تدخل كلمة مرور حسابك الرئيسي إذا كان يدعم كلمة مرور تطبيق.</p><form id="cloudSettings" class="stack"><label>رابط ملف JSON كامل (HTTPS)</label><input name="url" type="url" required placeholder="https://example.com/dav/trackern.json" value="${esc(S.sync.url||'')}"><label>اسم المستخدم</label><input name="username" autocomplete="username" value="${esc(S.sync.username||'')}"><label>كلمة مرور التطبيق (لا تُحفظ)</label><input name="password" type="password" autocomplete="off" required><button class="primary" type="button" onclick="syncCloud('upload')">↑ رفع نسخة إلى السحابة</button><button type="button" onclick="syncCloud('download')">↓ جلب نسخة من السحابة</button></form><p class="sub">المزامنة هنا يدوية وآمنة من الاستبدال غير المقصود بالتأكيد؛ ليست مزامنة خلفية متعددة الأجهزة. احفظ نسخة JSON محلية أولًا.</p>`)}
async function syncCloud(mode){const form=document.getElementById('cloudSettings');if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));let url;try{url=new URL(data.url);if(url.protocol!=='https:')throw Error('يجب استخدام HTTPS')}catch(e){alert('رابط غير صالح: '+e.message);return}const auth='Basic '+btoa(unescape(encodeURIComponent(data.username+':'+data.password)));S.sync={url:data.url,username:data.username};save();if(!confirm(mode==='upload'?'سيتم استبدال الملف البعيد بنسختك المحلية. هل أنت متأكد؟':'سيتم استبدال بياناتك المحلية ببيانات السحابة. هل صدّرت نسخة احتياطية؟'))return;try{const headers={Authorization:auth};let res;if(mode==='upload'){headers['Content-Type']='application/json';res=await fetch(url.href,{method:'PUT',headers,body:JSON.stringify({version:5,exportedAt:new Date().toISOString(),state:S})})}else{res=await fetch(url.href,{method:'GET',headers});if(res.ok){const obj=await res.json(),incoming=obj.state||obj;if(!Array.isArray(incoming.schedule))throw Error('الملف البعيد لا يحتوي على جدول صالح');S={...initial(),...incoming};ensureV5();save()}}if(!res.ok)throw Error('HTTP '+res.status);closeModal();render();alert(mode==='upload'?'تم الرفع':'تم الاستيراد من السحابة')}catch(e){alert('تعذرت العملية. تحقق من WebDAV وCORS والصلاحيات: '+e.message)}}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleString('ar-DZ',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});if(timer.active){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));if(timer.remaining<=0){timer.active=false;alert('انتهت جلسة التركيز. يمكنك تسجيلها.')}let el=document.getElementById('timerDisplay');if(el)el.textContent=formatTime(timer.remaining)}},1000);render();
</script></body></html>
